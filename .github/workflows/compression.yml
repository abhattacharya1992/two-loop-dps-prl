name: Compression and performance validation
on:
  push:
    branches: [main]
    paths-ignore:
      - compression/benchmark_snapshot.json
      - compression/00-performance-overview.svg
      - compression/RESULTS.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-pinned.txt
      - name: Compression codec and historical AA report unit tests
        run: make compression-tests PY=python
      - name: Lossless HH AA ZZ point compression and decode benchmark
        run: make compression-points PY=python
      - uses: actions/checkout@v4
        with:
          repository: abhattacharya1992/ggAA-threshold
          ref: main
          path: ggAA-threshold
      - name: Published AA exact versus beta6 report
        run: make compression-aa-recorded PY=python AA_REPO=ggAA-threshold
      - name: Unified two-stage HH AA ZZ pipeline
        run: make compression-unified PY=python AA_REPO=ggAA-threshold
      - name: Validate full-amplitude workflow and safeguards
        run: make compression-full-tests PY=python
      - name: Check HH ZZ precision sweeps and AA numerical gates
        run: |
          make compression-precision-tests PY=python
          python -m unittest discover -s compression -p 'test_accuracy_gate.py' -v
      - name: Validate automatic dashboard generation
        run: |
          python compression/update_dashboard.py \
            --artifact-dir compression-results \
            --run-id "$GITHUB_RUN_ID"
          test -s compression/00-performance-overview.svg
          test -s compression/RESULTS.md
      - name: Upload reproducible reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compression-performance-reports
          path: compression-results/
          if-no-files-found: warn
