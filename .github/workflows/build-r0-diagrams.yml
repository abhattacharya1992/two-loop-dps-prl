name: Build DPS reference figures

on:
  push:
    branches: [main]
    paths:
      - paper2/manuscript_prl/figures/collinear_diagrams_gg.tex
      - paper2/manuscript_prl/figures/collinear_diagrams_qq.tex
      - paper2/manuscript_prl/figures/selfenergy_soft_diagrams.tex
      - paper2/manuscript_prl/figures/dps_diagram.tex
      - paper2/manuscript_prl/figures/dps_diagram_tikz.tex
      - .github/workflows/build-r0-diagrams.yml

permissions:
  contents: write

concurrency:
  group: generated-assets-main
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-science texlive-fonts-recommended \
            texlive-latex-extra poppler-utils
      - name: Compile reference figures
        working-directory: paper2/manuscript_prl/figures
        run: |
          for name in collinear_diagrams_gg collinear_diagrams_qq selfenergy_soft_diagrams; do
            pdflatex -interaction=nonstopmode -halt-on-error "$name.tex" > "$name-build.log" || { tail -80 "$name-build.log"; exit 1; }
            test -s "$name.pdf"
          done
          pdflatex -interaction=nonstopmode -halt-on-error dps_diagram.tex > dps_diagram-build.log || { tail -80 dps_diagram-build.log; exit 1; }
          pdftocairo -png -r 150 -singlefile dps_diagram.pdf dps_diagram
          test -s dps_diagram.png
      - name: Commit compiled figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper2/manuscript_prl/figures/{collinear_diagrams_gg,collinear_diagrams_qq,selfenergy_soft_diagrams}.pdf paper2/manuscript_prl/figures/dps_diagram.png
          if ! git diff --cached --quiet; then
            git commit -m "Compile DPS kernel reference diagrams"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
