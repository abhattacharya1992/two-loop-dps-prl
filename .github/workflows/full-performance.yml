name: Full HH AA ZZ amplitude performance (manual)
on:
  workflow_dispatch:
    inputs:
      process:
        description: Select original exact amplitude process
        required: true
        type: choice
        options: [aa, hh, zz, all]
        default: aa
      beta:
        description: "Threshold beta (0 < beta <= 1/5)"
        required: true
        type: string
        default: "1/10"
      costheta:
        description: "cos(theta), from 0 to less than 1"
        required: true
        type: string
        default: "1/3"
      digits:
        description: "Working precision (20..120 decimal digits)"
        required: true
        type: number
        default: 120
      repeats:
        description: "Exact evaluation repetitions (1..5)"
        required: true
        type: number
        default: 1
      precision_levels:
        description: "HH/ZZ stability sweep digits (2..5 increasing, 20..120)"
        required: true
        type: string
        default: "40,60,80"

permissions:
  contents: read

jobs:
  benchmark:
    name: Exact ${{ matrix.process }} benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        process: ${{ fromJSON(inputs.process == 'all' && '["aa","hh","zz"]' || format('["{0}"]', inputs.process)) }}
    env:
      PYTHONUNBUFFERED: "1"
      PROCESS: ${{ matrix.process }}
      BETA: ${{ inputs.beta }}
      COSTHETA: ${{ inputs.costheta }}
      DIGITS: ${{ inputs.digits }}
      REPEATS: ${{ inputs.repeats }}
      PRECISION_LEVELS: ${{ inputs.precision_levels }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned scientific requirements
        run: python -m pip install -r requirements-pinned.txt
      - name: Guard tests before costly computation
        run: make compression-full-tests PY=python
      - name: Fetch verified AA full expressions
        if: matrix.process == 'aa'
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/abhattacharya1992/ggAA-threshold.git ggAA-threshold
          git -C ggAA-threshold checkout --detach 76491fd105e6f498be51affa213fe6839f879ce6
          bash ggAA-threshold/inputs/fetch_inputs.sh
      - name: Fetch verified HH full expressions
        if: matrix.process == 'hh'
        run: python paper2/hh/fetch_inputs.py
      - name: Fetch verified ZZ full expressions
        if: matrix.process == 'zz'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p paper2/zz/inputs
          curl --fail --location --retry 3 --retry-delay 5 --max-time 300 \
            --output paper2/zz/inputs/ggvvamp-1.0.tar.gz \
            https://lcgpackages.web.cern.ch/lcgpackages/tarFiles/sources/ggvvamp-1.0.tar.gz
          for filename in gg_projectors-1.0.inc gg_Aj_A_qT-1.0.inc.gz vvpmasters_opt-1.0.m.gz; do
            curl --fail --location --retry 3 --retry-delay 5 --max-time 300 \
              --output "paper2/zz/inputs/$filename" \
              "https://vvamp.hepforge.org/downloads/$filename"
          done
      - name: Verify all original published SHA-256 inputs
        shell: bash
        run: |
          set -euo pipefail
          python compression/full_performance.py verify-inputs \
            --process "$PROCESS" --beta "$BETA" --costheta "$COSTHETA" \
            --digits "$DIGITS" --repeats "$REPEATS"
      - name: Prepare ZZ translated exact evaluator
        if: matrix.process == 'zz'
        run: make -C paper2/zz inputs build PY=python
      - name: Stage 1 original amplitude evaluation
        shell: bash
        run: |
          set -euo pipefail
          python compression/full_performance.py stage1 \
            --process "$PROCESS" --beta "$BETA" --costheta "$COSTHETA" \
            --digits "$DIGITS" --repeats "$REPEATS"
      - name: HH ZZ precision convergence and archived reference checks
        if: matrix.process != 'aa'
        shell: bash
        run: |
          set -euo pipefail
          python compression/precision_sweep.py             --process "$PROCESS" --beta "$BETA" --costheta "$COSTHETA"             --precisions "$PRECISION_LEVELS"
      - name: Stage 2 verified performance report
        shell: bash
        run: |
          set -euo pipefail
          python compression/full_performance.py stage2 --process "$PROCESS" --require-precision
      - name: Upload exact performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-performance-${{ matrix.process }}-${{ github.run_id }}
          path: compression-results/full/${{ matrix.process }}/
          if-no-files-found: warn
          retention-days: 30
