name: Scientific and manuscript validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install scientific packages
        run: python -m pip install -r requirements-pinned.txt
      - name: Install TeX and related tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-publishers texlive-science texlive-plain-generic \
            texlive-fonts-recommended lmodern poppler-utils libginac-dev
      - name: Validate calculations
        run: |
          make test PY=python
          make -C paper2/r0/derivation test PYTHON=python
      - name: Compile manuscript and source archive
        run: |
          git restore --worktree -- \
            paper2/hh/rg_argument/results/verification.json \
            paper2/hh/stage2a/results_stage2a.json
          make build PY=python
          python paper2/manuscript_prl/make_arxiv.py --check
      - name: Upload validated documents
        uses: actions/upload-artifact@v4
        with:
          name: publication-files
          path: |
            paper2/manuscript_prl/letter.pdf
            paper2/manuscript_prl/supplement.pdf
            paper2/manuscript_prl/release/PRL_DPS_arxiv_sources.tar.gz
