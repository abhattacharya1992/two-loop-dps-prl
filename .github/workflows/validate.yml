name: Scientific and manuscript validation
on:
  push:
    branches: [main, 'cleanup/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install scientific packages
        run: python -m pip install -r requirements-pinned.txt
      - name: Install TeX and related tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-publishers texlive-science texlive-plain-generic \
            texlive-fonts-recommended lmodern poppler-utils libginac-dev
      - name: Verify calculations and rebuild publication
        run: make reproduce PY=python
      - name: Upload validated documents
        uses: actions/upload-artifact@v4
        with:
          name: publication-files
          path: |
            paper2/manuscript_prl/letter.pdf
            paper2/manuscript_prl/supplement.pdf
            paper2/manuscript_prl/release/PRL_DPS_arxiv_sources.tar.gz
